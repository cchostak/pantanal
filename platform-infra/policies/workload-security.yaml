apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sample-app-workload-security
spec:
  admission: true
  background: true
  validationFailureAction: Enforce
  rules:
    - name: require-restricted-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [sample-app]
      validate:
        podSecurity:
          level: restricted
          version: latest
    - name: disallow-mutable-image-tags
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [sample-app]
      validate:
        message: Images must use immutable sha256 digests.
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"
