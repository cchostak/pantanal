apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-verify
  namespace: ci
spec:
  params:
    - name: image
      type: string
    - name: digest
      type: string
  workspaces:
    - name: registry-auth
      readOnly: true
    - name: cosign-key
      readOnly: true
  steps:
    - name: verify
      image: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      command: [cosign]
      args:
        - verify
        - --allow-insecure-registry
        - --key
        - $(workspaces.cosign-key.path)/cosign.pub
        - $(params.image)@$(params.digest)
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.registry-auth.path)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
