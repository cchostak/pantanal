apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eventlistener-ingress
  namespace: ci
spec:
  podSelector:
    matchLabels:
      eventlistener: sample-app
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
      ports:
        - protocol: TCP
          port: 8080
